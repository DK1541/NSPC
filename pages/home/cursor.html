<!-- ===========================================================
     NSPC — shepherd cursor  (OPTIONAL)

     Replaces the system pointer with a robed figure carrying a staff
     and a lantern-warm light that follows wherever it goes.

     FILE: pages/home/cursor.html

     TO USE:  Squarespace → Settings → Advanced → Code Injection →
              FOOTER, and paste this whole block.
     TO REMOVE: delete it from Code Injection. Nothing else depends on it.

     NOTE ON PLACEMENT: this file lives in the home page folder, but
     Code Injection FOOTER applies to every page on the site. To keep
     the cursor on the homepage alone, paste it instead into the
     homepage'''s own Page Settings → Advanced → Page Header Code
     Injection.

     ── WHAT'S ON SCREEN ────────────────────────────────────────
     · a small gold dot marking the exact click point
     · the figure walking beside it
     · a soft warm light spreading around it
     · faint motes fading behind it

     The dot matters: with the system pointer hidden, a 60px figure
     gives no precise click target. The dot is the pointer; the
     figure is company.

     ── SWITCHES ────────────────────────────────────────────────
     FIGURE  'star' (default, sitewide) | 'jesus' | 'crook' | 'pineapple'
     LIGHT   size of the glow in px, 0 turns it off
     TRAIL   true / false

     ── WHICH FIGURE ────────────────────────────────────────────
     'star'  — the default. The star over the manger: eight points, a
               long lower ray, gold. Chosen for sitewide use.
     'jesus' — a robed figure with a staff, brown-skinned, as a
               first-century Palestinian Jew would have been. Intended
               for the children's ministry and Compassion Camp pages
               rather than the whole site.
     'crook' — the shepherd's staff alone.
     'pineapple' — the hospitality mark.
     =========================================================== -->

<style>
  /* the system pointer goes away everywhere, including over links */
  html.nspc-cursor-on, html.nspc-cursor-on *, html.nspc-cursor-on *::before,
  html.nspc-cursor-on *:hover, html.nspc-cursor-on a, html.nspc-cursor-on button,
  html.nspc-cursor-on input, html.nspc-cursor-on textarea, html.nspc-cursor-on select{
    cursor:none !important;
  }

  #nspc-glow,#nspc-shepherd,#nspc-dot,#nspc-motes{
    position:fixed;top:0;left:0;pointer-events:none;z-index:99999;
    will-change:transform;opacity:0;transition:opacity .3s ease;
  }
  #nspc-glow{
    width:420px;height:420px;margin:-210px 0 0 -210px;z-index:99997;
    background:radial-gradient(circle closest-side,
      rgba(255,206,110,.42) 0%,
      rgba(255,188,74,.22) 38%,
      rgba(255,176,48,.08) 62%,
      rgba(255,176,48,0) 100%);
    mix-blend-mode:screen;
  }
  #nspc-shepherd{width:62px;height:82px;margin:-14px 0 0 6px;z-index:99998;
    filter:drop-shadow(0 6px 10px rgba(60,40,10,.34))}
  #nspc-dot{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
    background:#FFD27A;box-shadow:0 0 0 1.5px rgba(90,60,15,.55),0 0 12px 3px rgba(255,190,80,.9)}
  #nspc-motes span{position:fixed;border-radius:50%;pointer-events:none;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,214,130,.95) 0%,rgba(255,183,60,0) 70%)}

  html.nspc-cursor-ready #nspc-glow,
  html.nspc-cursor-ready #nspc-shepherd,
  html.nspc-cursor-ready #nspc-dot{opacity:1}

  @media (hover:none),(max-width:899px),(prefers-reduced-motion:reduce){
    #nspc-glow,#nspc-shepherd,#nspc-dot,#nspc-motes{display:none!important}
  }
</style>

<div id="nspc-glow" aria-hidden="true"></div>
<div id="nspc-motes" aria-hidden="true"></div>
<svg id="nspc-shepherd" viewBox="0 0 62 82" aria-hidden="true" focusable="false"></svg>
<div id="nspc-dot" aria-hidden="true"></div>

<script>
(function () {
  var FIGURE = 'star';    // 'star' | 'jesus' | 'crook' | 'pineapple'
  var LIGHT  = 420;       // glow diameter in px, 0 = off
  var TRAIL  = true;

  var glow = document.getElementById('nspc-glow');
  var fig  = document.getElementById('nspc-shepherd');
  var dot  = document.getElementById('nspc-dot');
  var mote = document.getElementById('nspc-motes');
  if (!fig) return;

  var blocked = window.matchMedia('(hover:none)').matches ||
                window.matchMedia('(prefers-reduced-motion:reduce)').matches ||
                window.innerWidth < 900;
  if (blocked) { [glow,fig,dot,mote].forEach(function(n){ n && n.remove(); }); return; }

  var ART = {
    /* Robed figure with staff. Built in layers so it stays legible at 62px:
       halo ring, hair mass, face, beard, cream robe, blue mantle, staff. */
    jesus:
      '<g stroke-linejoin="round" stroke-linecap="round">' +
        /* staff, behind the body */
        '<path d="M49 20v58" stroke="#8A5A2B" stroke-width="3.4" fill="none"/>' +
        '<path d="M49 20c0-6.4 9.6-6.4 9.6 0 0 5.4-8 6.6-9.2 1.4" stroke="#8A5A2B" stroke-width="3.4" fill="none"/>' +
        /* halo */
        '<circle cx="24" cy="17" r="13.5" fill="none" stroke="#FFD27A" stroke-width="2.6" opacity=".95"/>' +
        /* hair falling to the shoulders */
        '<path d="M24 4c-8 0-11.5 5.4-11.5 12 0 5 .8 8.4 1.6 12.6.5 2.4-1 5-1 5s3-1.4 4-4.4c.7-2.2.4-6 .4-9.6 3.6.6 9.6-.6 12.6-3.4 1.6 2.2 3.6 3 5.4 3.2 0 3.4-.3 7.6.4 9.8 1 3 4 4.4 4 4.4s-1.5-2.6-1-5c.8-4.2 1.6-7.6 1.6-12.6C41.5 9.4 32 4 24 4Z" fill="#241611"/>' +
        /* face */
        '<path d="M24 9.5c4.9 0 8.2 3.4 8.2 8.6 0 6-3.6 10.6-8.2 10.6s-8.2-4.6-8.2-10.6c0-5.2 3.3-8.6 8.2-8.6Z" fill="#9C6B43"/>' +
        /* eyes */
        '<path d="M20.4 17.6h2.2M25.4 17.6h2.2" stroke="#160D08" stroke-width="1.5" fill="none"/>' +
        /* beard and moustache */
        '<path d="M15.8 19.4c0 6.2 3.6 12.4 8.2 12.4s8.2-6.2 8.2-12.4c0 4-2.4 6-8.2 6s-8.2-2-8.2-6Z" fill="#241611"/>' +
        '<path d="M21 22.4h6" stroke="#241611" stroke-width="2" fill="none"/>' +
        /* cream robe */
        '<path d="M24 30c-7 0-10.6 4.6-11.6 10.4L8 78h32l-4.4-37.6C34.6 34.6 31 30 24 30Z" fill="#FBF3E3" stroke="#C9A96E" stroke-width="1.4"/>' +
        /* blue mantle over the left shoulder */
        '<path d="M24 30c-7 0-10.6 4.6-11.6 10.4L8 78h9.6l3-33.6c.3-3.6 1.8-6 3.4-7.6V30Z" fill="#3E6E9B" stroke="#2C5476" stroke-width="1.2"/>' +
        /* sash and fold lines */
        '<path d="M13.6 46.6c6.4 3 14.4 3 20.8 0" stroke="#C9A96E" stroke-width="1.6" fill="none"/>' +
        '<path d="M27 52l-1.4 24M31.4 52l1 24" stroke="#E4D3AE" stroke-width="1.4" fill="none"/>' +
        /* arm reaching to the staff */
        '<path d="M33.6 40c4.6 1.6 10.4 4.4 14 8.6" stroke="#FBF3E3" stroke-width="6" fill="none"/>' +
        '<circle cx="48.2" cy="49.4" r="3.6" fill="#9C6B43"/>' +
      '</g>',

    /* The star over the manger: eight points, a long lower ray. */
    star:
      '<g transform="translate(23 30)">' +
        '<path d="M0 -26 L4.6 -7.4 L23 -12 L7.6 -0.6 L26 4 L6.4 5.4 L15 22 L0 9 ' +
              'L-15 22 L-6.4 5.4 L-26 4 L-7.6 -0.6 L-23 -12 L-4.6 -7.4 Z" ' +
              'fill="#E6B93C" stroke="#B8911F" stroke-width="1.2" stroke-linejoin="round"/>' +
        '<path d="M0 8 L2.4 44 L0 50 L-2.4 44 Z" fill="#E6B93C" opacity=".85"/>' +
        '<circle cx="0" cy="-1" r="4.4" fill="#FFF3D0"/>' +
      '</g>',

    crook:
      '<g fill="none" stroke-linecap="round">' +
        '<path d="M26 22v56" stroke="#8A5A2B" stroke-width="5"/>' +
        '<path d="M26 22c0-8 13-8 13 0 0 6.8-10.6 8.4-12 1.8" stroke="#8A5A2B" stroke-width="5"/>' +
        '<path d="M26 22v56" stroke="#C08A4A" stroke-width="1.6" opacity=".55"/>' +
      '</g>',

    pineapple:
      '<g stroke-linejoin="round">' +
        '<path d="M31 28c11 0 17.6 8 17.6 21.6S41 74 31 74 13.4 63.2 13.4 49.6 20 28 31 28Z" fill="#F0B429" stroke="#B77F14" stroke-width="2"/>' +
        '<path d="M31 34 24 42l7 8 7-8-7-8ZM31 50l-6.2 7 6.2 7 6.2-7-6.2-7Z" fill="none" stroke="#B77F14" stroke-width="1.5"/>' +
        '<path d="M31 28V8M31 11c-4.4-4.6-10-6-15.6-3.6 1.2 6 5.2 10 11 11.4M31 11c4.4-4.6 10-6 15.6-3.6-1.2 6-5.2 10-11 11.4" fill="none" stroke="#3E9BAB" stroke-width="3" stroke-linecap="round"/>' +
      '</g>'
  };

  fig.innerHTML = ART[FIGURE] || ART.jesus;
  document.documentElement.classList.add('nspc-cursor-on');

  if (LIGHT && glow) { glow.style.width = glow.style.height = LIGHT + 'px';
                       glow.style.margin = (-LIGHT / 2) + 'px 0 0 ' + (-LIGHT / 2) + 'px'; }
  else if (glow)     { glow.remove(); glow = null; }

  var tx = 0, ty = 0, fx = 0, fy = 0, gx = 0, gy = 0;
  var started = false, raf = 0, lastMote = 0;

  function place(node, x, y) { node.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)'; }

  function loop(now) {
    fx += (tx - fx) * 0.20;   // figure walks, slight lag
    fy += (ty - fy) * 0.20;
    gx += (tx - gx) * 0.11;   // light drifts slower still
    gy += (ty - gy) * 0.11;
    place(fig, fx, fy);
    if (glow) place(glow, gx, gy);

    if (TRAIL && now - lastMote > 55) {
      lastMote = now;
      var d = Math.hypot(tx - fx, ty - fy);
      if (d > 1.5) {
        var s = document.createElement('span');
        var size = 6 + Math.random() * 10;
        s.style.width = s.style.height = size + 'px';
        s.style.left = (fx + (Math.random() * 14 - 7)) + 'px';
        s.style.top  = (fy + 30 + (Math.random() * 14 - 7)) + 'px';
        mote.appendChild(s);
        s.animate(
          [{ opacity: .85, transform: 'translate(-50%,-50%) scale(1)' },
           { opacity: 0,   transform: 'translate(-50%,-60%) scale(.25)' }],
          { duration: 620 + Math.random() * 340, easing: 'ease-out' }
        ).onfinish = function () { s.remove(); };
      }
    }
    raf = requestAnimationFrame(loop);
  }

  window.addEventListener('mousemove', function (e) {
    tx = e.clientX; ty = e.clientY;
    place(dot, tx, ty);
    if (!started) {                       // land on the pointer, don't fly in from a corner
      started = true;
      fx = tx; fy = ty; gx = tx; gy = ty;
      place(fig, fx, fy); if (glow) place(glow, gx, gy);
      document.documentElement.classList.add('nspc-cursor-ready');
      raf = requestAnimationFrame(loop);
    }
  }, { passive: true });

  // leaving the window restores the ordinary pointer, so nothing is stranded
  document.addEventListener('mouseleave', function () {
    document.documentElement.classList.remove('nspc-cursor-ready', 'nspc-cursor-on');
  });
  document.addEventListener('mouseenter', function () {
    document.documentElement.classList.add('nspc-cursor-on');
    if (started) document.documentElement.classList.add('nspc-cursor-ready');
  });
})();
</script>
